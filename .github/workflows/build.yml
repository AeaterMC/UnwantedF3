name: build
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      # Finds the folder that contains settings.gradle (repo root or a subfolder).
      - name: Locate project
        id: loc
        run: |
          f=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$f" ]; then echo "No settings.gradle found in repo"; exit 1; fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew && ./gradlew build --stacktrace; else gradle build --stacktrace; fi

      - uses: actions/upload-artifact@v4
        with:
          name: cleanf3
          path: ${{ steps.loc.outputs.dir }}/build/libs/*.jar
